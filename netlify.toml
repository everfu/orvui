[build]
  base = "apps/docs"
  command = "pnpm --dir ../.. build"
  publish = "dist"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "24"
  PNPM_VERSION = "10.30.3"
  ORVUI_REGISTRY_ORIGIN = "https://orvui.efu.me"
